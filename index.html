<title>India Health Insurance Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: quiet editorial app — white page, one blue for action, red only where money can be lost.
   Four destinations (Home, Policies, Tools, Learn); a bottom bar on phones; details open in a sheet. */
:root{
  color-scheme: light;
  --ink:#101B2D; --ink-2:#2B3648; --muted:#5D6879; --faint:#8E97A6; --line:#E4E8EE; --line-2:#EEF1F5;
  --bg:#FFFFFF; --tint:#F6F8FB; --tint-2:#EEF2F8;
  --blue:#1F4FA3; --blue-ink:#163B7C; --blue-soft:#EDF2FB; --blue-line:#C8D6EF;
  --red:#D3222A; --red-ink:#A3141B; --red-soft:#FDEFEF; --red-line:#F4C9CB;
  --good:#1B7A4C; --good-soft:#E6F4EC; --amber:#A56300; --amber-soft:#FBF1DF;
  --psu:#1F4FA3; --pvt:#0D7E73; --sahi:#B86A00; --std:#5D6879; --life:#6A4795;
  --gold:#9A7400; --gold-soft:#FBF4DA; --silver:#5D6879; --silver-soft:#EEF1F5; --bronze:#9A5A2B; --bronze-soft:#F8EDE4;
  --f-head:"Plus Jakarta Sans","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --f-body:"Noto Sans","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --r:14px; --r-s:10px; --bar:60px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;color:var(--ink);text-wrap:balance;letter-spacing:-.012em}
h1{font-size:clamp(28px,5.2vw,46px);line-height:1.08;font-weight:800}
h2{font-size:clamp(21px,3vw,28px);line-height:1.2;font-weight:800}
h3{font-size:17px;line-height:1.3;font-weight:700}
h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
p{margin:0}
a{color:var(--blue);text-underline-offset:3px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12.5px;color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:12px} .stack-l{display:grid;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lead{font-size:17px;color:var(--muted);max-width:62ch}
.kicker{font:700 12px var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
mark.r{background:var(--red-soft);color:var(--red-ink);font-weight:650;padding:0 .2em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.b{background:none;color:var(--blue-ink);font-weight:700;padding:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--red) 0 34%,var(--blue) 34% 100%)}
.top .wrap{display:flex;align-items:center;gap:18px;height:var(--bar)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);flex:none}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--red);display:grid;place-items:center}
.brand b{font:800 16px var(--f-head);display:block;line-height:1.1}
.brand small{font-size:11.5px;color:var(--muted);display:block}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{appearance:none;border:0;background:none;padding:8px 12px;border-radius:9px;font:600 14.5px var(--f-head);color:var(--muted);cursor:pointer;position:relative}
.nav button:hover{color:var(--ink);background:var(--tint)}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-11px;height:2.5px;border-radius:2px;background:var(--blue)}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.lang{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font:700 13px var(--f-head);cursor:pointer;color:var(--ink-2)}
.btn{appearance:none;border:0;border-radius:10px;padding:0 16px;height:42px;font:700 14.5px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--blue);color:#fff} .btn.pri:hover{background:var(--blue-ink)}
.btn.red{background:var(--red);color:#fff} .btn.red:hover{background:var(--red-ink)}
.btn.sec{background:var(--bg);color:var(--blue);border:1.5px solid var(--blue-line)} .btn.sec:hover{background:var(--blue-soft)}
.btn.ghost{background:none;color:var(--blue);padding:0 6px;height:auto}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}

/* bottom bar */
.bnav{display:none}
@media (max-width:880px){
  .nav,.top .right .btn{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:4px env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .bnav button{appearance:none;border:0;background:none;padding:7px 2px 8px;display:grid;justify-items:center;gap:2px;font:600 11.5px var(--f-head);color:var(--muted);cursor:pointer}
  .bnav svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--blue)}
  .bnav .ask{color:var(--red)}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}

/* views */
main .view{padding-block:28px 72px}
main .view[hidden]{display:none}
[hidden]{display:none!important}
.hlink{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--bg)}.hlink:hover{border-color:var(--blue-line);background:var(--blue-soft)}.hlink.off{border-color:var(--blue-line)}.hlink b{display:block;color:var(--blue)}.hlink small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}.hlink small.u{color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts .btn{height:40px!important;min-height:0;flex:0 0 auto}
@media (max-width:560px){.acts{display:grid;grid-template-columns:1fr 1fr}.acts .btn{width:100%;padding:0 10px;font-size:13.5px}.acts .btn:first-child{grid-column:1/-1}}
.band{background:var(--tint);border-block:1px solid var(--line-2)}
.sec:not(.btn){display:grid;gap:16px;padding-block:30px}
.sec-h{display:grid;gap:6px;max-width:70ch}
.sec-h p{color:var(--muted)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;min-width:0;align-content:start}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}

/* home */
.hero{padding-block:40px 34px;display:grid;gap:18px}
.hero .lead{font-size:18px}
.ask-box{display:flex;gap:8px;max-width:640px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 24px rgba(16,27,45,.06)}
.ask-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.ask-box input{flex:1;min-width:0;border:0;background:none;padding:0 10px;font-size:16px;height:44px}
.ask-box input:focus{outline:none}
.ask-box input::placeholder{color:var(--faint)}
.trust{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted)}
.trust span{display:inline-flex;gap:7px;align-items:center}
.trust svg{color:var(--good);flex:none}
.tasks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.task{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:18px;display:grid;gap:10px;cursor:pointer;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
.task:hover{border-color:var(--blue-line);box-shadow:0 8px 24px rgba(31,79,163,.08);transform:translateY(-1px)}
.task .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.task.red .ic{background:var(--red-soft);color:var(--red)}
.task h3{font-size:16.5px}
.task p{font-size:14px;color:var(--muted)}
.task .go{font:700 13.5px var(--f-head);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font:600 13.5px var(--f-head);color:var(--ink-2);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip:hover{border-color:var(--blue-line);color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.stat{display:grid;gap:2px}
.stat b{font:800 24px var(--f-head);color:var(--ink)}
.stat span{font-size:13px;color:var(--muted)}
.stats{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* segmented + fields */
.seg{display:inline-flex;gap:4px;background:var(--tint);border:1px solid var(--line);border-radius:12px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{appearance:none;border:0;background:none;padding:8px 14px;border-radius:9px;font:700 14px var(--f-head);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(16,27,45,.12)}
.field{display:grid;gap:6px;min-width:0}
.field > span,.field > label{font:700 13.5px var(--f-head);color:var(--ink-2)}
.inp{height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:15px;min-width:0;width:100%}
textarea.inp{height:auto;min-height:180px;padding:12px;line-height:1.5;resize:vertical}
select.inp{padding-right:30px}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.inp::placeholder{color:var(--faint);opacity:1}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.form .full{grid-column:1/-1}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{appearance:none;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;font:600 14px var(--f-head);color:var(--ink-2);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}

/* finder bar */
.finder{display:grid;gap:14px;background:var(--tint);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.finder .line{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.finder .line .field{flex:1 1 180px}
.finder .age{max-width:150px}
.count{font-size:14px;color:var(--muted)} .count b{color:var(--ink)}

/* policy rows */
.plist{display:grid;gap:10px}
.prow{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr) auto;gap:16px;align-items:center;padding:16px 18px;transition:border-color .15s,box-shadow .15s}
.prow:hover{border-color:var(--blue-line);box-shadow:0 6px 20px rgba(16,27,45,.05)}
.prow .who{display:grid;gap:4px;min-width:0}
.prow .ins{font:700 12.5px var(--f-head);color:var(--c,var(--muted));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow h3{font-size:17px}
.prow h3 button{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.prow h3 button:hover{color:var(--blue)}
.facts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.f4{display:grid;gap:2px;min-width:0}
.f4 span{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-family:var(--f-head)}
.f4 b{font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.35}
.f4 b.bad{color:var(--red-ink)} .f4 b.ok{color:var(--good)}
.prow .act{display:grid;gap:8px;justify-items:end;text-align:right}
.price{font:800 17px var(--f-head);color:var(--ink)} .price small{display:block;font:500 11.5px var(--f-body);color:var(--faint)}
.tier{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font:800 11.5px var(--f-head);letter-spacing:.03em}
.tier.g{background:var(--gold-soft);color:var(--gold)} .tier.s{background:var(--silver-soft);color:var(--silver)} .tier.b{background:var(--bronze-soft);color:var(--bronze)} .tier.n{background:var(--tint);color:var(--faint)}
.score{display:inline-flex;align-items:baseline;gap:2px;font:800 15px var(--f-head);color:var(--ink)} .score small{font:600 11px var(--f-body);color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font:700 11.5px var(--f-head);background:var(--tint);color:var(--muted);white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)} .pill.red{background:var(--red-soft);color:var(--red-ink)} .pill.green{background:var(--good-soft);color:var(--good)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--c)}
@media (max-width:880px){.prow{grid-template-columns:1fr;gap:12px}.prow .act{justify-items:start;text-align:left;grid-auto-flow:column;justify-content:space-between;align-items:center}.facts4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:55;background:rgba(16,27,45,.42)}
.sheet{position:fixed;z-index:56;right:0;top:0;bottom:0;width:min(720px,100vw);background:var(--bg);box-shadow:-20px 0 60px rgba(16,27,45,.2);overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 22px 14px;display:flex;gap:12px;align-items:flex-start}
.x{appearance:none;border:0;background:var(--tint);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;color:var(--ink);flex:none;margin-left:auto}
.sheet-b{padding:20px 22px 28px;display:grid;gap:22px}
@media (max-width:880px){.sheet{top:auto;left:0;width:100%;max-height:94vh;border-radius:18px 18px 0 0}.sheet-h{padding-top:14px;border-radius:18px 18px 0 0}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv > div{padding:11px 13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:grid;gap:2px;font-size:14.5px}
.kv span{font:700 11.5px var(--f-head);color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.lists{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.yes,.no,.warn{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14.5px}
.yes li,.no li,.warn li{position:relative;padding-left:24px}
.yes li::before{content:"";position:absolute;left:3px;top:7px;width:11px;height:6px;border-left:2.4px solid var(--good);border-bottom:2.4px solid var(--good);transform:rotate(-45deg)}
.no li::before{content:"";position:absolute;left:3px;top:6px;width:11px;height:11px;background:linear-gradient(45deg,transparent 43%,var(--red) 43% 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,var(--red) 43% 57%,transparent 57%)}
.warn li::before{content:"";position:absolute;left:5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.alert{background:var(--red-soft);border:1px solid var(--red-line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.alert h4{color:var(--red-ink)}
.note{background:var(--blue-soft);border-radius:12px;padding:13px 15px;font-size:14.5px;color:var(--ink-2)}
.srcs{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px;font-size:14px}
.srcs .r{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:start}
.srcs .r > span:first-child{font:700 12px var(--f-head);color:var(--muted);padding-top:2px}
.srcs a{font-weight:600;word-break:break-word}
.srcs small{color:var(--faint);margin-left:6px;font-weight:500}
.bar{height:6px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.crit:last-child{border-bottom:0}

/* tables */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{font:700 11.5px var(--f-head);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--tint);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* tools */
.tool{display:grid;gap:18px}
.result{border:1.5px solid var(--blue-line);border-radius:var(--r);padding:20px;display:grid;gap:16px;background:var(--bg)}
.money{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.money > div{display:grid;gap:2px;padding:14px;border-radius:12px;background:var(--tint)}
.money b{font:800 24px var(--f-head)} .money span{font-size:13px;color:var(--muted)}
.money .you{background:var(--red-soft)} .money .you b{color:var(--red-ink)}
.money .ins b{color:var(--blue-ink)}
.steps-list{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps-list li{counter-increment:s;position:relative;padding:12px 14px 12px 52px;border:1px solid var(--line);border-radius:12px;font-size:14.5px}
.steps-list li::before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font:800 13px var(--f-head);display:grid;place-items:center}
.ledger{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:14.5px}
.ledger div:last-child{border-bottom:0}
.ledger .minus b{color:var(--red-ink)} .ledger .tot{background:var(--tint);font-weight:700}
.xr-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.xr-item q{display:block;font-size:13.5px;color:var(--ink-2);quotes:none;border-left:3px solid var(--line);padding-left:10px}
.drop{border:1.5px dashed var(--blue-line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--blue-soft)}
.letter{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;min-height:340px}

/* learn */
.sits{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.sit{appearance:none;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;color:inherit}
.sit:hover{border-color:var(--blue-line)}
.sit[aria-expanded="true"]{border-color:var(--blue);background:var(--blue-soft)}
.sit .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none}
.sit.risk .ic{background:var(--red-soft);color:var(--red)}
.sit h3{font-size:15px} .sit p{font-size:13px;color:var(--muted)}
.sitd{grid-column:1/-1;border:1.5px solid var(--blue-line);border-radius:var(--r);padding:20px;display:grid;gap:16px}
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
details.acc summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font:700 16px var(--f-head)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none}
details.acc[open] summary::after{transform:rotate(-135deg)}
details.acc .body{padding:0 16px 16px}
.scheme{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start}
.scheme .cover{font:800 19px var(--f-head);color:var(--blue-ink)}
.scheme ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.tl{display:grid;border-left:2px solid var(--line);margin-left:6px}
.tl div{position:relative;padding:0 0 14px 20px;font-size:14.5px}
.tl div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2.5px solid var(--red)}
.tl b{font:700 12.5px var(--f-head);color:var(--red-ink);display:block}

/* insurers */
.ilist{display:grid;gap:6px;max-height:640px;overflow:auto;padding-right:4px}
.irow{appearance:none;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;color:inherit}
.irow[aria-current="true"]{border-color:var(--blue);background:var(--blue-soft)}
.irow b{font:700 14px var(--f-head)} .irow small{display:block;font-size:12px;color:var(--muted)}
.explorer{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:880px){.explorer{grid-template-columns:1fr}.ilist{max-height:280px}}
svg text{font-family:var(--f-body);fill:var(--muted);font-size:11.5px} svg .lbl{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* compare tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(16,27,45,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.tray .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:10px}
@media (max-width:880px){.tray{bottom:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:0}}
.cmp td,.cmp th{min-width:180px} .cmp td:first-child,.cmp th:first-child{min-width:130px;color:var(--muted);font-weight:700;font-size:12.5px;position:sticky;left:0;background:var(--bg)}

/* chat */
.chat{position:fixed;z-index:50;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));height:min(680px,calc(100vh - 100px));background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(16,27,45,.22);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.chat[hidden]{display:none}
.chat-h{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-h .av{width:34px;height:34px;border-radius:10px;background:var(--red);display:grid;place-items:center;flex:none}
.chat-h b{font:800 15px var(--f-head);display:block} .chat-h small{font-size:12px;color:var(--muted)}
.msgs{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--tint);overscroll-behavior:contain}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.55;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.b p+p,.msg.b p+ul,.msg.b ul+p{margin-top:7px}
.msg.b ul{margin:6px 0 0;padding-left:18px;display:grid;gap:3px}
.msg .tiny{margin-top:6px}
.msg.typing{color:var(--muted);font-style:italic}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.refs button{appearance:none;border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue-ink);border-radius:999px;font:600 12px var(--f-head);padding:4px 10px;cursor:pointer;text-align:left}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugs button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);border-radius:999px;font:600 12.5px var(--f-head);padding:6px 11px;cursor:pointer;text-align:left}
.chat-f{border-top:1px solid var(--line);padding:10px;display:grid;gap:6px}
.chat-f form{display:flex;gap:8px}
.chat-f input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;height:46px;font-size:15px}
.chat-f input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.chat-f input::placeholder{color:var(--faint)}
.send{appearance:none;border:0;background:var(--red);color:#fff;width:46px;border-radius:12px;cursor:pointer;display:grid;place-items:center;flex:none}
.fab{position:fixed;z-index:45;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));appearance:none;border:0;background:var(--red);color:#fff;border-radius:999px;height:50px;padding:0 20px;font:700 15px var(--f-head);display:flex;gap:8px;align-items:center;box-shadow:0 10px 28px rgba(211,34,42,.35);cursor:pointer}
@media (max-width:880px){.fab{display:none}.chat{inset:0;width:auto;height:auto;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px)}}
.foot{border-top:1px solid var(--line);padding-block:24px 30px;font-size:13px;color:var(--muted);display:grid;gap:6px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;z-index:70;max-width:240px;line-height:1.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* v4: state, tooltips, dates */
.stack>*,.stack-l>*,.tool>*,.result>*{min-width:0}
.seg{max-width:100%;min-width:0}
.hero>*{min-width:0;max-width:100%}.ask-box input{min-width:0;flex:1 1 auto;width:100%}
.btn.ghost{white-space:normal;text-align:left}input[type=file]{max-width:100%}
.stbtn{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbtn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
.tipi{appearance:none;border:1.5px solid var(--blue-line);background:var(--bg);color:var(--blue);width:18px;height:18px;border-radius:50%;font:800 11px/1 var(--f-head);display:inline-grid;place-items:center;cursor:help;vertical-align:1px;margin-left:4px;padding:0}
.tipi:hover,.tipi:focus-visible{background:var(--blue);color:#fff}
[data-tip]{cursor:help}
button[data-tip],a[data-tip],input[data-tip]{cursor:pointer}
input[data-tip]{cursor:text}
.upd{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--f-body);color:var(--muted);background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0}
.upd::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.updline{margin:6px 0 0;display:flex;flex-wrap:wrap}
.chk{display:block;color:var(--good);font-weight:600}
.statebar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--blue-line);background:var(--blue-soft);border-radius:14px;padding:14px 18px;margin:4px 0 8px}
.statebar>div:first-child{display:grid;gap:2px}
.grid-states{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:8px 0}
.grid-states .opt{text-align:left;justify-content:flex-start}
.seg.sm{padding:3px}.seg.sm button{padding:7px 12px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(16,27,45,.12)}
.sortf{max-width:none}
.sugs button[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
#tip{white-space:normal}
@media (max-width:880px){.stbtn{max-width:120px;font-size:12.5px}}
@media (max-width:560px){.top .wrap{gap:10px}.brand{flex:1 1 auto;min-width:0}.brand>span:last-child{min-width:0}.brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:none}.top .right{flex:none;gap:6px}.stbtn{max-width:30vw}.top .lang{padding:6px 10px}}
@media (max-width:380px){.brand .mk{width:28px;height:28px}.brand b{font-size:14px}.stbtn{max-width:26vw}}

/* v4: plain-language calculator */
.calc{gap:18px}
.calc-head{display:grid;gap:6px;justify-items:start}
.calc-title{font:800 clamp(20px,3.2vw,26px)/1.2 var(--f-head);margin:0}
.calc-title .pname{color:var(--blue)}
.calc-head .chg{max-width:420px;width:100%}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--tint)}
.stepn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font:800 11.5px var(--f-head);margin-right:4px;vertical-align:1px}
.calc-res{gap:14px}
.big-ans{font:600 clamp(17px,2.3vw,20px)/1.5 var(--f-body);margin:0;color:var(--ink)}
.big-ans b{font-family:var(--f-head);font-weight:800}
.big-ans b.you,.whys .you{color:var(--red-ink)}.big-ans b.ins{color:var(--blue-ink)}
.big-ans.bad{color:var(--red-ink)}
.atleast{font-size:13px;color:var(--muted);font-weight:500}
.splitbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--line)}
.splitbar i{display:block;height:100%}.splitbar .ins{background:var(--blue)}.splitbar .you{background:var(--red)}
.splitlbl{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
.splitlbl .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}.dot.ins{background:var(--blue)}.dot.you{background:var(--red)}
.whys{margin:0;padding-left:20px;display:grid;gap:10px}.whys li p{margin:2px 0 0}
.good{border:1px solid #cfe9d8;background:#f1faf4;border-radius:12px;padding:12px 14px}.good ul{margin:6px 0 0}
.field.chk{display:flex;gap:10px;align-items:center;font-weight:600}.field.chk input{width:20px;height:20px;accent-color:var(--blue)}
@media (max-width:700px){.steps3{grid-template-columns:1fr;padding:12px}}

const GLOSS=[

let LANG="en";try{LANG=localStorage.getItem("ihg-lang")||"en"}catch(e){}
const T=k=>(I18N[LANG]&&I18N[LANG][k])||I18N.en[k]||k;

/* ===== Shared helpers ===== */
const IND=DATA.industry, INS=DATA.insurers;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n,d=0)=>n==null||isNaN(n)?"—":Number(n).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n,d=1)=>n==null?"—":fmt(n,d)+"%";
const rs=n=>n==null||isNaN(n)?"—":"₹"+fmt(Math.round(n));
const lakh=n=>n>=10000000?"₹"+fmt(n/10000000,n%10000000?1:0)+" crore":n>=100000?"₹"+fmt(n/100000,n%100000?1:0)+" lakh":rs(n);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return ""}};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* red = can cost you; blue bold = what you get */
function hr(s){let t=esc(s);
  t=t.replace(/(₹[\d,.]+(?:\s?(?:–|-|to)\s?₹?[\d,.]+)?(?:\s?(?:lakh|crore))?)/g,'<mark class="r">$1<\/mark>');
  t=t.replace(/(\b\d+(?:[.,]\d+)?(?:\s?[–-]\s?\d+)?\s?(?:years?|yrs?|months?|days?|weeks?|hours?)\b)/g,'<mark class="r">$1<\/mark>');
  t=t.replace(/((?:\+|−)?\d+(?:\.\d+)?(?:[–-]\d+(?:\.\d+)?)?%)/g,'<mark class="r">$1<\/mark>');
  return t}
function hb(s){return esc(s).replace(/(₹[\d,.]+(?:\s?[–-]\s?₹?[\d,.]+)?(?:\s?(?:lakh|crore|Cr|L))?|(?<!Health )\b[Uu]nlimited\b)/g,'<mark class="b">$1<\/mark>')}
const isNone=s=>/^(None|No limit|No zonal)/.test(s);
const planByName=n=>PLANS.find(p=>p.plan===n);
const insOf=p=>INS.find(r=>r.short===p.ins);
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
async function copyText(txt,el){try{await navigator.clipboard.writeText(txt);toast("Copied")}catch(e){if(el){el.focus();el.select?.()}toast("Select the text and copy it")}}
let DL=null;(async()=>{try{if(window.claude?.use)DL=await window.claude.use("downloads")}catch(e){DL=null}})();
async function saveFile(filename,data,type="text/plain"){
  if(DL){try{await DL.save({filename,data});return}catch(e){if(e?.code==="cancelled"||e?.code==="declined")return}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast("Download isn't available here")}
}

/* ===== Policy X-Ray (rules, runs on the page) ===== */
const XR_CATS=[
 {k:"ped",n:"Pre-existing disease waiting",re:/pre[\s-]?existing|\bPED\b/i,need:/wait|month|year/i},
 {k:"spec",n:"Specific-illness waiting",re:/specific(ied)?\s+(illness|disease|condition|surger)|listed\s+(illness|condition)/i,need:/wait|month|year/i},
 {k:"init",n:"First 30 days / initial waiting",re:/initial waiting|first\s+30\s+days|30\s+days\s+(from|of)\s+(the\s+)?(commencement|inception|first)/i},
 {k:"mat",n:"Maternity",re:/maternity|pregnan|delivery|childbirth|new[\s-]?born/i},
 {k:"copay",n:"Co-pay",re:/co[\s-]?pay(ment)?/i},
 {k:"room",n:"Room rent & ICU",re:/room\s+rent|room\s+category|single\s+private|shared\s+room|boarding|\bICU\b|intensive care/i},
 {k:"sub",n:"Caps and sub-limits",re:/sub[\s-]?limit|capped|maximum of|max\.?\s*(of\s*)?(rs|inr|₹)|limited to|up\s*to\s*(rs|inr|₹)|upto\s*(rs|inr|₹)|% of (the )?sum insured/i},
 {k:"ded",n:"Deductible",re:/deductible|aggregate deductible/i},
 {k:"rest",n:"Restoration / refill",re:/restor|reinstat|recharge|refill/i},
 {k:"bonus",n:"Bonus",re:/cumulative bonus|no[\s-]claim bonus|\bNCB\b/i},
 {k:"excl",n:"Exclusions",re:/exclu|not covered|not payable|shall not (be liable|cover|pay)|does not cover|will not pay/i},
 {k:"mora",n:"Moratorium (5-year rule)",re:/moratorium|sixty months|60 months of continuous/i},
 {k:"port",n:"Portability",re:/portab|migrat/i},
 {k:"free",n:"Free-look",re:/free[\s-]?look/i},
 {k:"grace",n:"Grace period",re:/grace period/i},
 {k:"claim",n:"Claims & cashless",re:/cashless|reimbursement|pre[\s-]?authori[sz]ation|intimat/i}
];
function redact(text){let n=0;const r=(re,lab)=>{text=text.replace(re,m=>{n++;return `[${lab} hidden]`})};
  r(/\b\d{4}\s?\d{4}\s?\d{4}\b/g,"Aadhaar");r(/\b[A-Z]{5}\d{4}[A-Z]\b/g,"PAN");r(/[\w.+-]+@[\w-]+\.[\w.]+/g,"email");
  r(/(?<!\d)(?:\+?91[\s-]?)?[6-9]\d{9}(?!\d)/g,"phone");r(/\b(?=[A-Z0-9\/-]{8,}\b)(?=[A-Z0-9\/-]*\d)(?=[A-Z0-9\/-]*[A-Z])[A-Z0-9\/-]+\b/g,"ID number");
  return {text,n}}
function sentencesOf(text){return text.replace(/\r/g,"").split(/(?<=[.;])\s+(?=[A-Z(•\d])|\n+/).map(s=>s.replace(/\s+/g," ").trim()).filter(s=>s.length>12&&s.length<700)}
function durations(s){return [...s.matchAll(/(\d{1,3})\s*(?:\(\w+\)\s*)?(days?|months?|years?)/gi)].map(m=>{const n=+m[1],u=m[2].toLowerCase();return {n,u,months:u.startsWith("y")?n*12:u.startsWith("m")?n:n/30,txt:m[0]}})}
function xrayRules(text){
  const S=sentencesOf(text),out={},flags=[],facts=[];
  XR_CATS.forEach(c=>{out[c.k]=S.filter(s=>c.re.test(s)&&(!c.need||c.need.test(s))).slice(0,6)});
  const ped=out.ped.flatMap(durations).filter(d=>d.months>=6);
  if(ped.length){const m=Math.max(...ped.map(d=>d.months));facts.push(["Pre-existing disease wait",ped.find(d=>d.months===m).txt]);if(m>36)flags.push(`Pre-existing wait of ${Math.round(m)} months is longer than the 36-month maximum under IRDAI's 2024 rules. Older policies may still show 48 months; ask your insurer.`)}
  const sp=out.spec.flatMap(durations).filter(d=>d.months>=6);if(sp.length)facts.push(["Specific-illness wait",sp.map(d=>d.txt).filter((v,i,a)=>a.indexOf(v)===i).join(", ")]);
  const cp=out.copay.flatMap(s=>[...s.matchAll(/(\d{1,2})\s?%/g)].map(m=>+m[1])).filter(v=>v>0&&v<=50);
  if(cp.length){facts.push(["Co-pay",[...new Set(cp)].map(v=>v+"%").join(", ")]);flags.push(`Co-pay found (${[...new Set(cp)].join("%, ")}%): you pay this share of every eligible claim it applies to.`)}
  const rr=out.room.map(s=>s.match(/(\d(?:\.\d+)?)\s?%\s*of\s*(the\s*)?sum insured/i)||s.match(/(?:rs\.?|inr|₹)\s?([\d,]+)\s*(?:\/-)?\s*(?:per|a)\s*day/i)).filter(Boolean);
  if(rr.length){facts.push(["Room-rent limit",rr[0][0]]);flags.push(`Room-rent limit found (${rr[0][0]}). A costlier room can cut room-linked charges in proportion.`)}
  else if(out.room.some(s=>/single private|shared/i.test(s)))facts.push(["Room category",(out.room.find(s=>/single private|shared/i.test(s)).match(/single private[^,.;]*|shared[^,.;]*/i)||[""])[0]]);
  if(out.sub.length)flags.push(`${out.sub.length} line(s) mention caps or sub-limits. Check whether they affect treatments you may need.`);
  if(out.ded.length)flags.push("A deductible is mentioned: you pay that amount before the insurer pays.");
  const mat=out.mat.flatMap(durations).filter(d=>d.months>=6);if(mat.length)facts.push(["Maternity wait",mat[0].txt]);
  const missing=XR_CATS.filter(c=>!out[c.k].length&&["ped","spec","copay","room","excl","rest","claim"].includes(c.k)).map(c=>c.n);
  return {out,flags,facts,missing,lines:S.length}}

const CLAIM_REASONS=[
 {k:"ped",n:"Not disclosed / pre-existing illness"},{k:"wait",n:"Waiting period not over"},{k:"room",n:"Room rent / proportionate deduction"},

  if(!greeted){greeted=true;addMsg("b",LANG==="hi"?`<p><b>नमस्ते!<\/b> मैं इस गाइड के आधार पर भारत में स्वास्थ्य बीमा के सवालों का जवाब देता हूँ: पॉलिसी, कीमत, वेटिंग, क्लेम, सरकारी योजनाएँ।<\/p><p class="tiny">वर्तनी की गलतियाँ और हिंग्लिश भी चलेगी।<\/p>${sugHTML(pick(4))}`:`<p><b>Namaste!<\/b> I answer questions about health insurance in India using this guide: policies, costs, waiting periods, claims, schemes and situations like surgery or accidents.<\/p><p class="tiny">Spelling mistakes and Hinglish are fine. I don't ask for your number or contact you.<\/p>${sugHTML(pick(4))}`)}
  if(prefill){$("#chatIn").value=prefill+" — "}setTimeout(()=>$("#chatIn").focus(),50)}
function closeChat(){$("#chat").hidden=true;$("#fab").hidden=false}
$("#chatX").addEventListener("click",closeChat);
$("#msgs").addEventListener("click",e=>{const cm=e.target.closest("[data-cmp]");if(cm){if(innerWidth<880)closeChat();go("policies");setCmp(cm.dataset.cmp.split(",").map(Number));showCompare();return}const ss=e.target.closest("[data-setstate]");if(ss){setState(ss.dataset.setstate);addMsg("b",`<p>${LANG==="hi"?"ठीक है, अब जवाब इस राज्य के लिए:":"Done. Answers are now for"} <b>${esc(ss.dataset.setstate)}<\/b>.<\/p>`);return}const s=e.target.closest("[data-sug]");if(s){send(s.dataset.sug);return}const r=e.target.closest("[data-ref]");if(r)openRef(r.dataset.ref)});
$("#chatForm").addEventListener("submit",e=>{e.preventDefault();const q=$("#chatIn").value.trim();if(!q||busy)return;$("#chatIn").value="";send(q)});
function openRef(id){const d=DOCS.find(x=>x.id===id);if(!d)return;const r=d.ref;if(innerWidth<880)closeChat();
  if(r.plan!=null)return openPolicy(r.plan);
  if(r.view==="whatif"){learnTab="whatif";openSit=r.sit||null;go("learn-whatif");return}
  if(r.view==="insurers"){isel=r.ins||isel;go("learn-insurers");return}
  if(r.view==="schemes")return go("learn-schemes");if(r.view==="rules")return go("learn-rights");if(r.view==="plans")return go("policies");
  if(r.view==="state"){if(r.state&&r.state!==myState)setState(r.state);return go("learn-state")}if(r.view==="registry")return go("learn-registry");
  if(r.view&&r.view.startsWith("tools"))return go(r.view);if(r.view==="method")return go("learn-method");go("home")}
function md(s){let t=esc(s).replace(/==(.+?)==/g,'<mark class="r">$1<\/mark>').replace(/\*\*(.+?)\*\*/g,"<strong>$1<\/strong>").replace(/\s?\[(\d+)\]/g,'<sup style="color:var(--blue);font-weight:700">[$1]<\/sup>');
  const out=[];let list=null;t.split(/\n/).forEach(l=>{const m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);if(m){if(!list){list=[];out.push(list)}list.push(m[1])}else{list=null;if(l.trim())out.push(l.trim())}});
  return out.map(x=>Array.isArray(x)?`<ul>${x.map(i=>`<li>${i}<\/li>`).join("")}<\/ul>`:`<p>${x}<\/p>`).join("")}
function planChips(text){const t=String(text);const f=PLANS.filter(p=>t.includes(p.plan.split(" (")[0].split(" / ")[0].split(" →")[0]));return f.length?`<div class="refs">${f.slice(0,8).map(p=>`<button type="button" data-pol="${p.id}">${esc(short(p.plan))} →<\/button>`).join("")}<\/div>`:""}
const HI=LANG==="hi";
const SMALL={
  greet:()=>(LANG==="hi"?"<p>नमस्ते! स्वास्थ्य बीमा के बारे में कुछ भी पूछें।<\/p>":"<p>Namaste! Ask me anything about health insurance in India.<\/p>")+sugHTML(pick(4)),
  thanks:()=>(LANG==="hi"?"<p>आपका स्वागत है। कुछ और पूछना है?<\/p>":"<p>You're welcome. Anything else about your cover?<\/p>")+sugHTML(pick(3)),
  bye:()=>LANG==="hi"?"<p>ध्यान रखें। जब चाहें फिर पूछें।<\/p>":"<p>Take care. Come back any time you have a question about your policy.<\/p>",
  who:()=>`<p>I'm the helper for this <b>Health Insurance Guide<\/b>. I find the answer in the guide and show it to you as written: 30 policies, IRDAI's list of insurers, claim records, government schemes, your state's Ombudsman office and corporate agents.<\/p><p class="tiny">No AI-written answers, no medical or financial advice, no calls, no sign-up.<\/p>${sugHTML(pick(3))}`,
  medical:()=>`<p>I can't give medical advice. Please speak to a doctor.<\/p><p>I <b>can<\/b> tell you whether a treatment is covered and what you may pay.<\/p>${sugHTML(["Is hospitalisation for dengue covered?","What will I pay for a knee replacement?","What if I need surgery?"])}`,
  otherIns:()=>`<p>This guide covers <b>health insurance<\/b>, plus accident, travel and home-fire cover. It doesn't cover car, life or investment products.<\/p>${sugHTML(["What does personal accident insurance pay?","Fire at home — what's covered?","Travel insurance abroad"])}`,
  offtopic:()=>`<p>That's outside what I know. I only answer questions from this health-insurance guide.<\/p>${sugHTML(pick(3))}`,
  unknown:(r)=>`<p>I couldn't find that in this guide. Try different words${r.hits.length?", or open a close topic:":"."}<\/p>${r.hits.length?`<div class="refs">${r.hits.slice(0,3).map(h=>`<button type="button" data-ref="${h.d.id}">${esc(h.d.title)}<\/button>`).join("")}<\/div>`:""}${sugHTML(pick(3))}`
};
async function send(q){
  if(busy)return;busy=true;$("#chatSend").disabled=true;addMsg("u",esc(q));
  const r=BOT.search(q,{state:myState});const chg=r.changes.filter(([x,y])=>x!=="mystate"&&y!=="mystate"&&!x.startsWith(y)&&!y.startsWith(x));const fix=chg.length?`<p class="tiny">Understood as: ${chg.map(([a,b])=>`<s>${esc(a)}<\/s> ${esc(b)}`).join(", ")}<\/p>`:"";
  if(r.intent==="needState"){addMsg("b",`<p>${LANG==="hi"?"आप किस राज्य में हैं? चुनें, फिर मैं सिर्फ़ उसी राज्य की जानकारी दूँगा।":"Which state are you in? Pick one and I'll answer for that state only."}<\/p>${statePickHTML()}`);done();return}
  if(r.intent!=="answer"){addMsg("b",SMALL[r.intent](r));done();return}
  const named=plansIn(q);
  let html=(named.length>=2&&/\b(vs|versus|compare|comparison|or|better|difference|ya|बनाम|तुलना)\b/i.test(q))?compareCard(named.slice(0,3)):extractive(r.hits.slice(0,6),r,q)+fix;
  const st=r.state;
  if(st&&/(complain|complaint|ombudsman|grievance|reject|shikayat|शिकायत)/i.test(q)&&!r.hits[0].d.id.startsWith("state-")){const om=REG.OMB.filter(o=>o.states.includes(st));if(om.length)html+=`<p class="small"><b>Insurance Ombudsman for ${esc(st)}:<\/b> ${om.map(o=>`${esc(o.city)} office, ${esc(o.email)}${o.note&&o.note.startsWith(st)?` <span class="tiny">(${esc(o.note)})<\/span>`:""}`).join("; ")}<\/p>`}
  if(r.qState&&r.qState!==myState)html+=`<div class="refs"><button type="button" data-setstate="${esc(r.qState)}">${LANG==="hi"?"इसे मेरा राज्य बनाएँ":"Set "+esc(r.qState)+" as my state"}<\/button><\/div>`;
  else if(st&&!r.qState)html+=`<p class="tiny">${LANG==="hi"?"आपके राज्य के अनुसार":"Answer for your state"}: <b>${esc(st)}<\/b> · <button class="btn ghost" type="button" data-pickstate>${LANG==="hi"?"बदलें":"change"}<\/button><\/p>`;
  addMsg("b",html);
  done();function done(){busy=false;$("#chatSend").disabled=false}
}
function plansIn(q){const ql=" "+String(q).toLowerCase().replace(/[^a-z0-9+ ]/g," ").replace(/\s+/g," ")+" ";
  return PLANS.filter(p=>{const core=p.plan.split(" (")[0].split(" / ")[0].toLowerCase().replace(/[^a-z0-9+ ]/g," ").replace(/\s+/g," ").trim();return core.length>3&&ql.includes(" "+core+" ")})}
function compareCard(ps){const row=(l,f)=>`<tr><td><b>${l}<\/b><\/td>${ps.map(p=>`<td>${f(p)}<\/td>`).join("")}<\/tr>`;
  return `<p><b>${ps.map(p=>esc(short(p.plan))).join(" vs ")}<\/b><\/p><div class="tbl"><table><thead><tr><th><\/th>${ps.map(p=>`<th>${esc(short(p.plan))}<br><span class="tiny">${esc(p.ins)}<\/span><\/th>`).join("")}<\/tr><\/thead><tbody>
   ${row("Price (sample)",p=>hb(p.prem))}${row("Old-illness wait",p=>hr(p.ped))}${row("Co-pay",p=>hr(p.copay))}${row("Room rent",p=>hr(p.room))}${row("Maternity",p=>hr(p.maternity))}${row("Cover refill",p=>esc(p.restore))}<\/tbody><\/table><\/div>
   <p class="tiny">${esc(T("upd_terms"))}<\/p><div class="refs"><button type="button" data-cmp="${ps.map(p=>p.id).join(",")}">${LANG==="hi"?"पूरी तुलना खोलें":"Open full comparison"} →<\/button>${ps.map(p=>`<button type="button" data-pol="${p.id}">${esc(short(p.plan))} →<\/button>`).join("")}<\/div>`}
function cityIn(q,st){const ql=String(q).toLowerCase();const cs=[...new Set(REG.CA.filter(c=>c[4]===st).map(c=>c[3]))];return cs.find(c=>c.length>2&&ql.includes(c.toLowerCase()))||null}
function stateCard(st,q){
  const sch=SCHEMES.filter(s=>s.st===st),om=REG.OMB.filter(o=>o.states.includes(st)),ag=REG.CA.filter(c=>c[4]===st&&c[2]!=="L"&&!c[6]);
  return `<p><b>${esc(st)}<\/b><\/p><ul>
   <li><b>${esc(T("stSchemes"))}:<\/b> ${sch.length?sch.map(s=>{const c=s.pts.find(p=>/announc|awaited|finalis|being finalised|check the state/i.test(p));return `${esc(s.n.replace(/^[^:]+:\s*/,""))} — ${hb(s.cover)}${c?` <span class="tiny" style="color:var(--red-ink)">(${esc(c)})<\/span>`:""} <span class="tiny">(${esc(s.src)})<\/span>`}).join("; "):esc(T("noStateScheme"))}<\/li>
   <li><b>${esc(T("centralAll"))}<\/b> ${esc(T("centralAllP"))}<\/li>
   <li><b>${esc(T("ombH"))}:<\/b> ${om.length?om.map(o=>`${esc(o.city)}, ${esc(o.email)}${o.note&&o.note.startsWith(st)?` <span class="tiny">(${esc(o.note)})<\/span>`:""}`).join("; "):esc(T("noOmb"))}<\/li>
   <li><b>${esc(T("caH"))}:<\/b> ${ag.length}<\/li><\/ul>
   <div class="refs"><button type="button" data-go="learn-state">${esc(T("seeState"))} →<\/button><button type="button" data-go="learn-schemes">${esc(T("schemes"))} →<\/button><\/div>`}
function agentsCard(st,q){
  const city=cityIn(q,st);let ag=REG.CA.filter(c=>c[4]===st&&c[2]!=="L"&&!c[6]);
  if(city)ag=[...ag.filter(c=>c[3]===city),...ag.filter(c=>c[3]!==city)];
  return `<p><b>${esc(T("caH").replace(/your state/i,st))}<\/b>${city?` <span class="tiny">· ${esc(city)} first<\/span>`:""}<\/p><ul>${ag.slice(0,10).map(c=>`<li>${esc(c[1])} <span class="tiny">(${esc(c[3])} · ${{C:"Composite",G:"General"}[c[2]]} · valid upto ${esc(c[5])})<\/span><\/li>`).join("")}<\/ul>
   <p class="tiny">${ag.length} in IRDAI's list for ${esc(st)}. ${esc(T("caNote"))} ${esc(T("upd_registry"))}<\/p>
   <div class="refs"><button type="button" data-ref="ca-${esc(st)}">${LANG==="hi"?"सभी देखें":"See all"} →<\/button><\/div>`}
function regCard(){const R=REG.INSURERS.filter(r=>r.sells_health);const g=(f,l)=>`<li><b>${l}:<\/b> ${R.filter(f).map(r=>esc(r.name.replace(/ (Co\.|Company|Insurance Co\.|Ltd\.|Limited).*$/,"")+"")).join(", ")}<\/li>`;
  return `<p><b>${esc(T("regHealth"))} (${R.length})<\/b><\/p><ul>${g(r=>r.sector==="Public","Public sector")}${g(r=>r.cat==="General"&&r.sector==="Private","Private general")}${g(r=>r.cat==="Standalone health","Standalone health")}<\/ul><p class="tiny">${esc(T("upd_registry"))}<\/p><div class="refs"><button type="button" data-go="learn-registry">${esc(T("allIns"))} →<\/button><\/div>`}
function extractive(hits,r,q){
  const id0=hits[0].d.id,agentQ=/(agent|bank|buy|sell|seller|corporate|bancassurance|kahan se|कहाँ से)/i.test(q);
  if((id0.startsWith("state-")||(r.qState&&hits[0].d.st===r.qState&&hits[0].d.kind!=="Corporate agents"))&&agentQ)return agentsCard(hits[0].d.st,q);
  if(id0.startsWith("state-")||(r.qState&&hits[0].d.st===r.qState&&!id0.startsWith("ca-")&&String(q).trim().split(/\s+/).length<=3))return stateCard(hits[0].d.st,q);
  if(id0.startsWith("ca-")&&id0!=="ca-about")return agentsCard(hits[0].d.st,q);
  if(id0==="reg-health")return regCard();
  if(/\b(which|company|companies|insurer|insurers|who|kaun|private|govt|gov|government|public|list)\b/i.test(q||"")){const i=hits.findIndex(h=>/list|Transplant cover/i.test(h.d.kind));if(i>0)hits=[hits[i],...hits.filter((_,j)=>j!==i)]}
  if(hits[0].d.id.startsWith("tx-")&&hits[0].d.id!=="tx-all"){const all=DOCS.find(d=>d.id==="tx-all");if(all)hits=[{d:all},...hits]}
  const top=hits[0].d,isList=/list|Transplant/i.test(top.kind);let ss=BOT.excerpt(top,r.fixed,isList?20:5);
  if(r.state){const other=new RegExp("\\b("+ALL_STATES.filter(s=>s!==r.state&&s.length>3).map(s=>s.replace(/[&]/g,"\\&")).join("|")+")\\b","i");const kept=ss.filter(s=>!other.test(s.label+" "+s.text));if(kept.length)ss=kept}
  const risky=/not covered|watch|wait|co-pay|copay|exclu|room|reject|limit/i;
  const same=ss.length>2&&ss.every(s=>s.label&&s.label===ss[0].label);
  const body=(same?`<li style="list-style:none;margin-left:-18px"><b>${esc(ss[0].label)}:<\/b><\/li>`:"")+ss.map(s=>{const pl=isList?PLANS.find(p=>s.text.startsWith(p.plan)):null;return `<li>${s.label&&!same?`<b>${esc(s.label)}:<\/b> `:""}${pl?`<button class="btn ghost" type="button" data-pol="${pl.id}" style="text-align:left;font-weight:600">${esc(s.text.replace(/\.$/,""))}<\/button>`:risky.test(s.label)?hr(s.text):hb(s.text)}<\/li>`}).join("");
  const dateLine=top.kind==="Policy"?`<p class="tiny">${esc(T("upd_terms"))}<\/p>`:/Corporate agents|Registered insurers/.test(top.kind)?`<p class="tiny">${esc(T("upd_registry"))}<\/p>`:"";
  return `<p><b>${esc(top.title)}<\/b><\/p><ul>${body}<\/ul>${dateLine}${isList?"":planChips(ss.map(s=>s.label+" "+s.text).join(" "))}<div class="refs"><button type="button" data-ref="${top.id}">Open full details →<\/button>${hits.slice(1,3).map(h=>`<button type="button" data-ref="${h.d.id}">${esc(h.d.title)}<\/button>`).join("")}<\/div>`}

window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(/^policy-\d+$/.test(h)){if(cur!=="policies")go("policies");openPolicy(+h.split("-")[1])}else go(h||"home")});
applyLang();
const start=(location.hash||"").slice(1);
if(/^policy-\d+$/.test(start)){go("policies");openPolicy(+start.split("-")[1])}
else if(/^vs-\d+-\d+/.test(start))go(start);
else go(start||"home",{keepScroll:true});

</script>
